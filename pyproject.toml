[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-llm-eval"
version = "0.1.0"
description = "Rubric-based evaluation of large language model answers to biology questions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ryan McDowell" }]
keywords = ["llm", "evaluation", "biology", "benchmark", "rubric", "annotation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=7.4", "ruff==0.16.10"]
notebook = ["jupyter>=1.0", "matplotlib>=3.7"]

[project.scripts]
bioeval = "bioeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bioeval = ["data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
